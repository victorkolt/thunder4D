[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[project]
name = "thunder4d"
license = "MIT"
license-files = ["LICENSE"]
version = "0.9.3"
description = "thunder4d: Transverse-resolved Herriott-cell UPPE solver for Nonlinear Dynamics close to Experimental Reality, 4D"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Victor Koltalo", email = "victor.koltalo@ensta.fr" }]
keywords = ["UPPE", "multipass cell", "MPC", "nonlinear optics", "ultrafast", "post-compression",
            "Herriott cell", "spatio-temporal", "pulse propagation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
examples = ["matplotlib"]
gpu = ["cupy-cuda12x"]

[dependency-groups]
dev = ["pytest>=9.2.0"]
docs = ["sphinx>=7", "sphinx_rtd_theme>=2"]

[project.urls]
Documentation = "https://victorkolt.github.io/thunder4D/"
Source = "https://github.com/victorkolt/thunder4D"

[tool.pytest.ini_options]
testpaths = ["tests"]
