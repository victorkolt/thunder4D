[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[project]
name = "thunder4d"
license = "MIT"
license-files = ["LICENSE"]
version = "1.3.0"
description = "4D pulse propagation in gas-filled multipass cells: UPPE solver, design helper and GUI"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Victor Koltalo", email = "victor.koltalo@ensta.fr" },
            { name = "Melvin Redon", email = "melvin.redon@fysik.lth.se" }]
keywords = ["UPPE", "multipass cell", "MPC", "nonlinear optics", "ultrafast", "post-compression",
            "Herriott cell", "spatio-temporal", "pulse propagation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0",
    "pyfftw>=0.15.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
examples = ["matplotlib"]
gpu = ["cupy-cuda12x"]
gui = ["pyside6-essentials>=6.12.0", "matplotlib>=3.10.9"]   # thunder4d-gui (Qt widgets + embedded plots)
numba = ["numba>=0.61"]   # fused multithreaded CPU kernels for the 4D solvers
fftw = ["pyfftw>=0.14"]   # planned FFTW transforms on the CPU (fft_backend="fftw")

[dependency-groups]
# matplotlib: plots, pyside6 + pytest-qt: GUI, numba + pyfftw: CPU options (type-checked and tested in CI)
dev = ["matplotlib>=3.10.9", "numba>=0.61", "pyfftw>=0.14", "pyside6-essentials>=6.12.0", "pytest>=9.2.0",
       "pytest-qt>=4.5.0", "ruff>=0.17.3", "ty>=0.0.95"]
docs = ["sphinx>=7", "sphinx_rtd_theme>=2"]

[project.scripts]
thunder4d-gui = "thunder4d.gui:main"   # installed always; says how to add the [gui] extra when it is missing

[project.urls]
Documentation = "https://victorkolt.github.io/thunder4D/"
Source = "https://github.com/victorkolt/thunder4D"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 120
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
extend-select = ["E501", "W"]   # no formatter: keep line length and whitespace in check

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # re-exports
"benchmark/*.py" = ["RUF012"]   # benchmarks are declared as class attributes (params, reference, ...), never mutated

[tool.ruff.lint.isort]
known-local-folder = ["helpers", "framework", "analyze"]   # tests/helpers.py, benchmark/
combine-as-imports = true

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.analysis]
replace-imports-with-any = ["cupy", "cupyx.**"]   # optional dependency (gpu extra)
