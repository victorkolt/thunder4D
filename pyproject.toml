[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[project]
name = "thunder4d"
license = "MIT"
license-files = ["LICENSE"]
version = "0.10.0"
description = "thunder4d: Transverse-resolved Herriott-cell UPPE solver for Nonlinear Dynamics close to Experimental Reality, 4D"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Victor Koltalo", email = "victor.koltalo@ensta.fr" }]
keywords = ["UPPE", "multipass cell", "MPC", "nonlinear optics", "ultrafast", "post-compression",
            "Herriott cell", "spatio-temporal", "pulse propagation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
examples = ["matplotlib"]
gpu = ["cupy-cuda12x"]

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.3", "ty>=0.0.95"]
docs = ["sphinx>=7", "sphinx_rtd_theme>=2"]

[project.urls]
Documentation = "https://victorkolt.github.io/thunder4D/"
Source = "https://github.com/victorkolt/thunder4D"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# the notebooks and benchmark/ are being reworked on another branch: lint them once it is merged
extend-exclude = ["*.ipynb", "benchmark"]

[tool.ruff.lint]
extend-select = ["E501", "W"]   # no formatter: keep line length and whitespace in check

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # re-exports

[tool.ruff.lint.isort]
known-local-folder = ["helpers"]   # tests/helpers.py
combine-as-imports = true

[tool.ty.src]
include = ["src", "tests"]
